<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" id="theme-color" content="#1a1a1d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231a1a1d%27/%3E%3Cpath d=%27M12 9l11 7-11 7z%27 fill=%27%23c2f28b%27/%3E%3C/svg%3E">
  <meta name="description" content="Choose a clicker game to play.">
  <title>Clickers Arcade</title>
  <script>
    try {
      var savedTheme = localStorage.getItem('theme');
      if (/^(void|dark|white|blue)$/.test(savedTheme)) document.documentElement.dataset.theme = savedTheme;
    } catch (error) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="themes.css">
  <style>
    body { display: grid; place-items: center; padding: 24px; background: var(--glow, var(--bg)), var(--bg); }
    main {
      position: relative;
      z-index: 1;
      width: min(900px, 100%);
      padding: clamp(24px, 6vw, 54px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    [data-theme="void"] main { backdrop-filter: none; -webkit-backdrop-filter: none; }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 10px 0 8px;
      font: 600 clamp(34px, 7vw, 56px)/1.05 var(--display);
      letter-spacing: -.04em;
      color: var(--ink);
    }
    .intro { margin: 0; color: var(--muted); }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 14px;
      margin-top: 32px;
    }
    .game {
      display: flex;
      min-height: 190px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--card);
      color: var(--ink);
      text-decoration: none;
      transition: transform .18s, border-color .18s, background .18s;
    }
    .game:hover, .game:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(var(--ac), .36);
      background: var(--card-hover);
      outline: none;
    }
    [data-theme="white"] .game { box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    [data-theme="white"] .game:hover { box-shadow: 0 8px 24px rgba(0,0,0,.10); }
    .game small { color: var(--muted); font-size: 12px; }
    .game strong { display: block; margin-top: 8px; font-size: 23px; letter-spacing: -.02em; }
    .launch { color: var(--accent); font-size: 13px; font-weight: 700; }
    footer { margin-top: 24px; color: var(--faint); font-size: 12px; }
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>

  <div class="theme-picker floating">
    <button class="theme-btn" id="theme-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="theme-menu">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
      <span class="theme-label">Theme</span>
    </button>
    <div class="theme-menu" id="theme-menu" role="menu" aria-label="Choose a theme" hidden>
      <button class="theme-opt" role="menuitemradio" data-t="void" aria-checked="false"><span class="swatch sw-void"></span>The Void<span class="check">âœ“</span></button>
      <button class="theme-opt" role="menuitemradio" data-t="dark" aria-checked="true"><span class="swatch sw-dark"></span>Dark<span class="check">âœ“</span></button>
      <button class="theme-opt" role="menuitemradio" data-t="white" aria-checked="false"><span class="swatch sw-white"></span>White<span class="check">âœ“</span></button>
      <button class="theme-opt" role="menuitemradio" data-t="blue" aria-checked="false"><span class="swatch sw-blue"></span>Dark Blue<span class="check">âœ“</span></button>
    </div>
  </div>

  <main>
    <div class="eyebrow">Clickers Arcade</div>
    <h1>Pick your game</h1>
    <p class="intro">Two clicker worlds. Choose one to launch.</p>
    <nav class="games" aria-label="Clicker games">
      <a class="game" href="./spacebar/">
        <span><small>Tap, upgrade, repeat</small><strong>Spacebar Clicker</strong></span>
        <span class="launch">Play game â†—</span>
      </a>
      <a class="game" href="./cookieclicker-2.052/">
        <span><small>Cookie Clicker Â· Version 2.052</small><strong>Cookie Clicker</strong></span>
        <span class="launch">Play game â†—</span>
      </a>
    </nav>
    <footer>Games open in their own pages. Your browser saves game progress locally.</footer>
  </main>
  <script src="themes.js"></script>
</body>
</html>
